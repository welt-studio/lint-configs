# Hooks que os projetos usam deste repo pelo pre-commit (`repo: https://github.com/welt-studio/lint-configs`).

# Mantém `ruff-base.toml` na raiz do projeto igual ao `ruff/base.toml` do `rev` declarado.
- id: ruff-base
  name: ruff-base (padrão Ruff da Welt Studio)
  entry: sync_base.py ruff
  language: script
  pass_filenames: false
  always_run: true

# Mantém `pyright-base.json` na raiz do projeto igual ao `pyright/base.json` do `rev` declarado.
- id: pyright-base
  name: pyright-base (padrão Pyright da Welt Studio)
  entry: sync_base.py pyright
  language: script
  pass_filenames: false
  always_run: true

# Mantém `.prettierignore` igual ao `prettier/ignore` do `rev` declarado: na raiz, ou na pasta de
# onde o Prettier roda, passada em `args` (ex.: `args: [frontend]`).
- id: prettier-base
  name: prettier-base (padrão Prettier da Welt Studio)
  entry: sync_base.py prettier
  language: script
  pass_filenames: false
  always_run: true

# Mantém `.jscpd.json` (a trava) e `.jscpd-semantic.json` (o relatório semântico) na raiz do projeto
# iguais ao `jscpd/` do `rev` declarado.
- id: jscpd-base
  name: jscpd-base (padrão jscpd da Welt Studio)
  entry: sync_base.py jscpd
  language: script
  pass_filenames: false
  always_run: true

# Confere no `pyproject.toml` do pacote Python as opções do padrão de testes (o pytest não herda
# config, então não há cópia): na raiz, ou na pasta do pacote passada em `args` (ex.: `args: [backend]`).
- id: pytest-base
  name: pytest-base (padrão de testes da Welt Studio)
  entry: check_pytest.py
  language: script
  pass_filenames: false
  always_run: true
