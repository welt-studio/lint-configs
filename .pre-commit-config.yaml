# Pre-commit do próprio standards: o repo segue o padrão que publica, com os mesmos hooks dos
# projetos. Instalar: uvx pre-commit@4.7.0 install
#
# Os hooks `*-base` rodam os scripts deste working tree (`hooks/`), não uma tag: o padrão em edição
# é o que vale para o próprio repo. Nos projetos, os mesmos hooks vêm do `rev` de cada um.

# Os três ganchos num `install` só. A lista substitui o padrão do pre-commit: sem o `commit-msg`
# aqui, o conventional-pre-commit nunca é instalado.
default_install_hook_types: [pre-commit, commit-msg, pre-push]

# Sem isto todo hook vale para todos os estágios instalados: os do commit rodariam de novo na
# mensagem do commit e no push. Quem precisa de outro estágio declara `stages:` (testes, mensagem).
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      # As cópias do padrão na raiz (`ruff-base.toml`, `pyright-base.json`, `.prettierignore`,
      # `.jscpd*.json`), regeradas dos arquivos deste repo. Não se editam: o hook desfaz.
      - id: ruff-base
        name: ruff-base (padrão Ruff da Welt Studio)
        entry: hooks/sync_base.py ruff
        language: script
        pass_filenames: false
        always_run: true
      - id: pyright-base
        name: pyright-base (padrão Pyright da Welt Studio)
        entry: hooks/sync_base.py pyright
        language: script
        pass_filenames: false
        always_run: true
      - id: prettier-base
        name: prettier-base (padrão Prettier da Welt Studio)
        entry: hooks/sync_base.py prettier
        language: script
        pass_filenames: false
        always_run: true
      - id: jscpd-base
        name: jscpd-base (padrão jscpd da Welt Studio)
        entry: hooks/sync_base.py jscpd
        language: script
        pass_filenames: false
        always_run: true
      # O `pyproject.toml` da raiz segue o padrão de testes; o `pnpm-workspace.yaml` e o `devEngines`,
      # a política de scripts de instalação do pnpm.
      - id: pytest-base
        name: pytest-base (padrão de testes da Welt Studio)
        entry: hooks/check_pytest.py
        language: script
        pass_filenames: false
        always_run: true
      - id: pnpm-base
        name: pnpm-base (scripts de instalação, padrão da Welt Studio)
        entry: hooks/check_pnpm.py
        language: script
        pass_filenames: false
        always_run: true
      # Dependências Python do pacote da raiz (os scripts de `hooks/` e as ferramentas do grupo dev).
      - id: deptry
        name: deptry (dependências Python, padrão da Welt Studio)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: (\.py|pyproject\.toml|uv\.lock)$

  # Python - Ruff e Pyright do venv da raiz (versões do `uv.lock`, a mesma que a CI roda).
  - repo: local
    hooks:
      - id: ruff
        name: Ruff Linter
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format
        language: system
        types: [python]
      # O projeto inteiro (`pass_filenames: false`): os scripts dos hooks estão em strict sem fila.
      - id: pyright
        name: Pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false

  # JavaScript/TypeScript - Prettier, ESLint, tsc e Knip do workspace da raiz (versões do
  # `pnpm-lock.yaml`), com os scripts do `package.json` como a única declaração de cada comando.
  - repo: local
    hooks:
      # Todo arquivo de texto: o `--ignore-unknown` pula o que o Prettier não formata, e o que não se
      # formata fica fora pelo `.prettierignore` (hook `prettier-base`).
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write --ignore-unknown
        language: system
        types: [text]
      # Quem decide o que é lintado é o `eslint.config.mjs` (`files`, `untypedFiles`, `ignores`). O
      # fixture do teste do ESLint tem config própria (o ESLint 10 usa a mais próxima do arquivo) e
      # viola o padrão de propósito: quem o confere é o teste do pacote.
      - id: eslint
        name: ESLint
        entry: pnpm run lint:files --fix
        language: system
        # O `identify` do pre-commit marca `.tsx` como `tsx` e `.jsx` como `jsx`, não `ts`/`javascript`.
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^eslint/test/fixture/
      - id: type-check
        name: TypeScript Check
        entry: pnpm run type-check
        language: system
        files: (\.d\.ts|tsconfig[^/]*\.json|package\.json|pnpm-lock\.yaml)$
        pass_filenames: false
      # O grafo inteiro: o arquivo que fica órfão é o que o commit deixou de importar.
      - id: knip
        name: Knip
        entry: pnpm run knip
        language: system
        files: (\.(js|mjs|cjs|jsx|ts|tsx)|package\.json|pnpm-workspace\.yaml|knip\.json)$
        pass_filenames: false

  # Duplicação - jscpd no repo inteiro, com a cópia do padrão (`.jscpd.json`).
  - repo: local
    hooks:
      - id: jscpd
        name: Duplicação (jscpd)
        entry: pnpm run duplication
        language: system
        types_or: [python, javascript, jsx, ts, tsx]
        pass_filenames: false

  # Testes - no push (não travam o commit).
  - repo: local
    hooks:
      # Com a cobertura e o piso: o `--cov` está no `addopts` do `pyproject.toml`. Os testes também
      # conferem texto (as listas de ignores em `tests/test_ignores.py`, as versões do `uvx` em
      # `tests/test_tool_versions.py`), então o hook roda também quando só ele muda.
      - id: pytest
        name: Pytest (hooks)
        entry: uv run pytest -q
        language: system
        files: (\.(py|md|ya?ml)|pyproject\.toml|uv\.lock|ignores\.json|/ignore|/base\.(json|toml)|semantic\.json)$
        pass_filenames: false
        stages: [pre-push]
      - id: package-tests
        name: Testes dos pacotes (ESLint, Prettier, tsconfig, Vitest)
        entry: pnpm test
        language: system
        files: ^(eslint|prettier|tsconfig|vitest)/|^(package\.json|pnpm-lock\.yaml)$
        pass_filenames: false
        stages: [pre-push]

  # Repos de terceiros fixados por SHA, com a versão no comentário (a forma do
  # `pre-commit autoupdate --freeze`): uma tag pode ser movida para outro código, um SHA não. O
  # gerenciador `pre-commit` do Renovate atualiza o SHA e o comentário juntos.

  # Security - Gitleaks (secret detection)
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
        name: Gitleaks (Detect secrets)

  # Git - Commits convencionais
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8 # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Git - Verificações básicas
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Remove trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      # Fim de linha `lf` em tudo (como o `[format]` do Ruff e o Prettier): um CRLF vindo do Windows
      # vira diff em toda linha do arquivo.
      - id: mixed-line-ending
        name: Fix mixed line endings
        args: [--fix=lf]
      # Dois arquivos que só diferem na caixa (`Button.tsx` e `button.tsx`) quebram o checkout no
      # macOS e no Windows.
      - id: check-case-conflict
        name: Check for case conflicts
      # O lockfile do pnpm 12 tem dois documentos (o pnpm fixado e o lock). A flag
      # `--allow-multiple-documents` fica só nele: valendo para todos os YAMLs, um `---` perdido num
      # compose ou workflow (que só lê o primeiro documento) passaria calado.
      - id: check-yaml
        name: Check YAML syntax
        exclude: (^|/)pnpm-lock\.yaml$
      - id: check-yaml
        name: Check YAML syntax (pnpm-lock, multi-documento)
        alias: check-yaml-pnpm-lock
        args: [--allow-multiple-documents]
        files: (^|/)pnpm-lock\.yaml$
      - id: check-json
        name: Check JSON syntax
        # JSONC: o Pyright e o TypeScript leem comentário; quem valida esses é a própria ferramenta.
        exclude: (^|/)(tsconfig[^/]*|pyright-base|pyrightconfig)\.json$|^(pyright|tsconfig)/base\.json$
      - id: check-toml
        name: Check TOML syntax
      - id: check-added-large-files
        name: Check for large files
        args: [--maxkb=1000]
      - id: check-merge-conflict
        name: Check for merge conflicts
      - id: detect-private-key
        name: Detect private keys

# O Python dos hooks acompanha o minor do `.python-version`.
default_language_version:
  python: python3.14

fail_fast: false
