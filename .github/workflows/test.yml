# O próprio standards no padrão que ele publica: os hooks do `.pre-commit-config.yaml` no repo
# inteiro (as cópias, Ruff, Pyright, Prettier, ESLint, tsc, Knip, jscpd, gitleaks e os básicos) e os
# testes (os dos hooks em Python, com o piso de cobertura, e os dos pacotes). Roda em todo push
# e PR na `main`, inclusive nos PRs do Renovate que sobem os plugins: uma versão nova que mude o que o
# padrão reprova fica vermelha aqui antes de virar tag.
#
# Todo `uses:` fixado por SHA, com a versão no comentário ao lado; o Renovate atualiza os dois.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# No PR, push novo cancela o run obsoleto; na `main`, cada commit tem grupo próprio e é conferido.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Padrão e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O uv do `[tool.uv] required-version` do pyproject; o ambiente ativado põe no PATH o Python do
      # `.python-version`, o que o `default_language_version` do pre-commit pede.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version-file: pyproject.toml
          activate-environment: true
      # O pnpm do `packageManager` e o Node do `devEngines.runtime` do `package.json` da raiz (o pnpm o
      # baixa, `onFail: "download"`): a única declaração de cada versão.
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked
      - name: Hooks do padrão
        run: uvx pre-commit@4.7.0 run --all-files --show-diff-on-failure
      # A cobertura e o relatório vêm do `addopts` do `pyproject.toml`.
      - name: Testes dos hooks (pytest, com cobertura)
        if: ${{ !cancelled() }}
        run: uv run pytest
      - name: Testes dos pacotes
        if: ${{ !cancelled() }}
        run: pnpm test
